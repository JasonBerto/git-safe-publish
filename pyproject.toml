[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-safe-publish"
version = "0.1.0"
description = "CLI toolchain to detect and prevent accidental publication of sensitive data via git"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "security", "secrets", "cli", "devtools"]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
git-safe-publish = "git_safe_publish.cli:publish"
git-safe-push    = "git_safe_publish.cli:push"
git-safe-check   = "git_safe_publish.cli:check"
git-safe-search  = "git_safe_publish.cli:search"

[tool.hatch.build.targets.wheel]
packages = ["src/git_safe_publish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"

[tool.ruff]
line-length = 100
target-version = "py39"
